kind = "web"
previewPath = "/"
title = "Home Tasks PWA"
version = "1.0.0"
id = "artifacts/home-tasks"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19890

[services.development]
run = "pnpm --filter @workspace/home-tasks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/home-tasks", "run", "build" ]
serve = "static"
publicDir = "artifacts/home-tasks/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19890"
BASE_PATH = "/"
